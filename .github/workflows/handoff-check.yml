name: Handoff Check

on:
  pull_request:
  workflow_dispatch:

jobs:
  handoff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - run: npm ci
      - run: npm run build
      - run: node dist/index.js --no-cache
      - run: node dist/index.js check . --max-age 1
      - uses: actions/upload-artifact@v4
        with:
          name: HANDOFF.md
          path: HANDOFF.md
